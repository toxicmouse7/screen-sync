[package]
name = "screen_sync"
version = "1.1.0"
authors = ["Aleksej Gladkov <aleksej.s.gladkov@gmail.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[dependencies]
anyhow = "1"
eframe = { version = "0.36.0", features = ["persistence"] }
mdns-sd = "0.21.6"
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.25.1", default-features = false }
windows-capture = "=2.0.1"
windows-sys = { version = "0.61.2", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Security",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = "3.0.12"
